<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marea Grande</title>
    
    <!-- Enlace al Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#12181f">

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // Inicializá acá tu User ID / Public Key de EmailJS
            emailjs.init("TU_PUBLIC_KEY_HERE");
        })();
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #12181f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .header img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #00E676;
            margin-bottom: 10px;
            object-fit: cover;
        }

        .header h1 {
            font-size: 28px;
            color: #00E676;
        }

        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #00E676;
            color: #000000;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #00c853;
        }

        /* Botón de instalación directo por si el navegador lo requiere */
        .btn-instalar-directo {
            background-color: #2563eb;
            color: white;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- Logo de Marea Grande bien grande -->
        <img src="https://pertecarariffrancisco-lgtm.github.io/logo.png" alt="Marea Grande Logo">
        <h1>Marea Grande 🌊</h1>
        <p style="color: #94a3b8; font-size: 14px;">Organizador de Actividades</p>
    </div>

    <!-- Formulario para cargar actividad -->
    <div class="card">
        <h2>Registrar Nueva Actividad</h2>
        <input type="text" id="actividad" placeholder="Nombre de la actividad (ej: Historia)">
        <input type="text" id="hora" placeholder="Hora (ej: 11:50 hs)">
        <button onclick="enviarActividad()">Enviar y Notificar 🚀</button>
        
        <!-- Botón fallback por si no salta automático -->
        <button id="btnInstalar" class="btn-instalar-directo" style="display: none;" onclick="lanzarInstalacionDirecta()">
            📲 Instalar App Marea Grande
        </button>
    </div>

    <script>
        // -------------------------------------------------------------
        // 1. LÓGICA DE INSTALACIÓN DIRECTA (PWA)
        // -------------------------------------------------------------
        let deferredPrompt = null;

        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker listo'))
                .catch(err => console.log('Error SW:', err));
        }

        // Interceptamos el evento para disparar el cartel emergente nativo
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;

            // Intenta lanzarlo directamente
            lanzarInstalacionDirecta();

            // Muestra botón auxiliar de respaldo
            const btn = document.getElementById('btnInstalar');
            if (btn) btn.style.display = 'block';
        });

        // Función para lanzar la ventana emergente de instalación directa
        async function lanzarInstalacionDirecta() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`Respuesta de instalación: ${outcome}`);
                deferredPrompt = null;
            }
        }

        // Si el navegador exige un toque previo en pantalla, salta al primer click
        window.addEventListener('click', () => {
            if (deferredPrompt) {
                lanzarInstalacionDirecta();
            }
        }, { once: true });


        // -------------------------------------------------------------
        // 2. ENVÍO DE NOTIFICACIÓN CON LOGO DE MAREA GRANDE
        // -------------------------------------------------------------
        function enviarActividad() {
            const actividad = document.getElementById('actividad').value;
            const hora = document.getElementById('hora').value;

            if (!actividad || !hora) {
                alert('Por favor completá los campos');
                return;
            }

            // Datos enviados a la plantilla de EmailJS incluyendo el logo
            const templateParams = {
                user_avatar: "https://pertecarariffrancisco-lgtm.github.io/logo.png",
                user_name: "Marea Grande",
                actividad: actividad,
                hora: hora
            };

            emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", templateParams)
                .then(function(response) {
                    alert('¡Actividad notificada con éxito!');
                    document.getElementById('actividad').value = '';
                    document.getElementById('hora').value = '';
                }, function(error) {
                    alert('Error al enviar la notificación: ' + JSON.stringify(error));
                });
        }
    </script>
</body>
</html>
