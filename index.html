<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marea Grande - Planificador</title>
  <style>
    :root {
      --primary: #1a365d;
      --secondary: #2b6cb0;
      --accent: #319795;
      --bg: #f7fafc;
      --card-bg: #ffffff;
      --text: #2d3748;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      color: var(--primary);
      font-size: 2.2rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
    }

    .hidden {
      display: none !important;
    }

    /* Estilos del Cuestionario / Onboarding */
    .step {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .step h2 {
      color: var(--secondary);
      font-size: 1.4rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    input, select {
      padding: 10px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--secondary);
    }

    .btn {
      background-color: var(--secondary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      transition: background 0.2s;
      align-self: flex-start;
    }

    .btn:hover {
      background-color: var(--primary);
    }

    /* Estilos de la App Principal */
    .planner-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--bg);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .grid-week {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .day-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 15px;
    }

    .day-card h3 {
      color: var(--primary);
      margin-bottom: 10px;
      font-size: 1.1rem;
      border-bottom: 1px solid #cbd5e0;
      padding-bottom: 5px;
    }

    .activity-list {
      list-style: none;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .activity-item {
      background: white;
      padding: 8px 10px;
      border-radius: 4px;
      border-left: 4px solid var(--accent);
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .add-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #edf2f7;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .form-row input, .form-row select {
      flex: 1;
      min-width: 140px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌊 Marea Grande</h1>
    <p>Organizador de Horarios y Entrenamientos</p>
  </header>

  <!-- SECCIÓN 1: CUESTIONARIO INICIAL (ONBOARDING) -->
  <div id="onboarding-section" class="container">
    <div class="step">
      <h2>¡Bienvenido! Configurá tu perfil</h2>
      <div class="input-group">
        <label for="username">¿Cómo te llamás?</label>
        <input type="text" id="username" placeholder="Tu nombre...">
      </div>
      <div class="input-group">
        <label for="sport">¿Qué deporte o actividad principal practicás?</label>
        <input type="text" id="sport" placeholder="Ej: Rugby, Natación, Gimnasio...">
      </div>
      <div class="input-group">
        <label for="goal">¿Cuál es tu objetivo principal?</label>
        <select id="goal">
          <option value="Rendimiento deportivo">Mejorar rendimiento deportivo</option>
          <option value="Organización escolar/deportiva">Balancear estudio y deporte</option>
          <option value="Salud y hábito">Mantener salud y constancia</option>
        </select>
      </div>
      <button class="btn" onclick="finishOnboarding()">Guardar e Iniciar</button>
    </div>
  </div>

  <!-- SECCIÓN 2: APLICACIÓN PRINCIPAL (CALENDARIO Y ACTIVIDADES) -->
  <div id="app-section" class="container hidden">
    <div class="planner-header">
      <div>
        <h2 id="welcome-message">Hola, Deportista</h2>
        <p id="user-info" style="font-size: 0.9rem; color: #718096;"></p>
      </div>
      <button class="btn" onclick="resetProfile()" style="background-color: #e53e3e;">Cambiar Perfil</button>
    </div>

    <!-- Cargar Nueva Actividad -->
    <div class="add-form">
      <h3>Añadir Actividad al Calendario</h3>
      <div class="form-row">
        <input type="text" id="act-name" placeholder="Nombre (Ej: Entrenamiento, Estudio...)">
        <select id="act-day">
          <option value="Lunes">Lunes</option>
          <option value="Martes">Martes</option>
          <option value="Miércoles">Miércoles</option>
          <option value="Jueves">Jueves</option>
          <option value="Viernes">Viernes</option>
          <option value="Sábado">Sábado</option>
          <option value="Domingo">Domingo</option>
        </select>
        <input type="time" id="act-time">
      </div>
      <button class="btn" onclick="addActivity()">+ Agregar Actividad</button>
    </div>

    <!-- Vista Semanal -->
    <div class="grid-week">
      <div class="day-card">
        <h3>Lunes</h3>
        <ul class="activity-list" id="list-Lunes"></ul>
      </div>
      <div class="day-card">
        <h3>Martes</h3>
        <ul class="activity-list" id="list-Martes"></ul>
      </div>
      <div class="day-card">
        <h3>Miércoles</h3>
        <ul class="activity-list" id="list-Miércoles"></ul>
      </div>
      <div class="day-card">
        <h3>Jueves</h3>
        <ul class="activity-list" id="list-Jueves"></ul>
      </div>
      <div class="day-card">
        <h3>Viernes</h3>
        <ul class="activity-list" id="list-Viernes"></ul>
      </div>
      <div class="day-card">
        <h3>Sábado</h3>
        <ul class="activity-list" id="list-Sábado"></ul>
      </div>
      <div class="day-card">
        <h3>Domingo</h3>
        <ul class="activity-list" id="list-Domingo"></ul>
      </div>
    </div>
  </div>

  <script>
    // Variables globales
    let userData = JSON.parse(localStorage.getItem('marea_user')) || null;
    let activities = JSON.parse(localStorage.getItem('marea_activities')) || [];

    // Inicialización al cargar la página
    window.onload = function() {
      if (userData) {
        showApp();
      } else {
        showOnboarding();
      }
    };

    function showOnboarding() {
      document.getElementById('onboarding-section').classList.remove('hidden');
      document.getElementById('app-section').classList.add('hidden');
    }

    function showApp() {
      document.getElementById('onboarding-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');
      
      document.getElementById('welcome-message').innerText = `Hola, ${userData.name}`;
      document.getElementById('user-info').innerText = `Deporte: ${userData.sport} | Objetivo: ${userData.goal}`;
      
      renderActivities();
    }

    function finishOnboarding() {
      const name = document.getElementById('username').value.trim();
      const sport = document.getElementById('sport').value.trim();
      const goal = document.getElementById('goal').value;

      if (!name || !sport) {
        alert('Por favor completá tu nombre y deporte');
        return;
      }

      userData = { name, sport, goal };
      localStorage.setItem('marea_user', JSON.stringify(userData));
      showApp();
    }

    function addActivity() {
      const name = document.getElementById('act-name').value.trim();
      const day = document.getElementById('act-day').value;
      const time = document.getElementById('act-time').value;

      if (!name) {
        alert('Escribí el nombre de la actividad');
        return;
      }

      const newAct = { id: Date.now(), name, day, time };
      activities.push(newAct);
      localStorage.setItem('marea_activities', JSON.stringify(activities));
      
      document.getElementById('act-name').value = '';
      document.getElementById('act-time').value = '';
      
      renderActivities();
    }

    function renderActivities() {
      // Limpiar listas
      const days = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
      days.forEach(d => {
        document.getElementById(`list-${d}`).innerHTML = '';
      });

      // Insertar elementos
      activities.forEach(act => {
        const list = document.getElementById(`list-${act.day}`);
        if (list) {
          const li = document.createElement('li');
          li.className = 'activity-item';
          li.innerHTML = `
            <span>${act.time ? '<b>' + act.time + '</b> - ' : ''}${act.name}</span>
            <button onclick="deleteActivity(${act.id})" style="background:none; border:none; color:red; cursor:pointer;">✕</button>
          `;
          list.appendChild(li);
        }
      });
    }

    function deleteActivity(id) {
      activities = activities.filter(act => act.id !== id);
      localStorage.setItem('marea_activities', JSON.stringify(activities));
      renderActivities();
    }

    function resetProfile() {
      if (confirm('¿Querés borrar el perfil y volver a empezar?')) {
        localStorage.removeItem('marea_user');
        localStorage.removeItem('marea_activities');
        userData = null;
        activities = [];
        showOnboarding();
      }
    }
  </script>
</body>
</html>
